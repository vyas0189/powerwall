name: Deploy Tesla Scheduler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.10.5
  # Role assumed via GitHub OIDC (created in terraform-bootstrap). This is the
  # only auth path; the former long-lived CI access keys have been retired.
  AWS_OIDC_ROLE_ARN: arn:aws:iam::358870220937:role/netzero-github-actions-oidc

jobs:
  terraform-pr:
    name: terraform (PR check)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: terraform init -backend=false
    
    - name: Terraform Validate
      run: terraform validate

  terraform:
    name: terraform
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: |
        terraform plan \
          -var="site_id=${{ secrets.SITE_ID }}" \
          -out=tfplan

    # Persist the approved plan so the apply job applies exactly what was
    # reviewed, rather than re-planning. The plan embeds the site_id var value,
    # so it is retained for only 1 day and relies on the repo being private.
    - name: Upload Terraform plan
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tfplan
        path: terraform/tfplan
        retention-days: 1
        if-no-files-found: error


  approve:
    name: Manual Approval
    permissions: {}
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Manual approval checkpoint
      run: echo "Manual approval required to proceed with deployment"

  apply:
    name: Apply Terraform Changes
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [terraform, approve]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Terraform Init
      run: terraform init

    # Retrieve the plan produced (and approved) in the terraform job and apply
    # exactly that, so the applied changes match what was reviewed.
    - name: Download Terraform plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: tfplan
        path: terraform

    # Build the Lambda deployment packages on this runner. The Terraform config
    # also builds them via a null_resource provisioner, but that only re-runs
    # when its source hashes change; a function-code update applied from a saved
    # plan can otherwise reference a .zip that was never built on this fresh
    # runner. Building here guarantees the artifacts exist before apply.
    - name: Build Lambda packages
      working-directory: ${{ github.workspace }}
      run: |
        for fn in morning evening; do
          rm -rf "temp_$fn"
          mkdir -p "temp_$fn"
          cp "${fn}_config.py" netzero_client.py requirements.txt "temp_$fn/"
          python3 -m pip install --quiet -r requirements.txt -t "temp_$fn"
          (cd "temp_$fn" && zip -rq "$GITHUB_WORKSPACE/terraform/${fn}_config.zip" .)
          rm -rf "temp_$fn"
        done
        ls -l terraform/morning_config.zip terraform/evening_config.zip

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan

