name: Deploy Tesla Scheduler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.10.5
  # Role assumed via GitHub OIDC (created in terraform-bootstrap). This is the
  # only auth path; the former long-lived CI access keys have been retired.
  AWS_OIDC_ROLE_ARN: arn:aws:iam::358870220937:role/netzero-github-actions-oidc

jobs:
  terraform-pr:
    name: terraform (PR check)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: terraform init -backend=false
    
    - name: Terraform Validate
      run: terraform validate

  terraform:
    name: terraform
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: |
        terraform plan \
          -var="site_id=${{ secrets.SITE_ID }}" \
          -out=tfplan

    # Persist the approved plan so the apply job applies exactly what was
    # reviewed, rather than re-planning. The plan embeds the site_id value and
    # a state snapshot, and artifacts on a public repo can be downloaded by any
    # signed-in GitHub user, so it is encrypted with the SITE_ID secret first:
    # only someone who already holds site_id can read it. Retained for 1 day.
    - name: Encrypt Terraform plan
      env:
        TFPLAN_KEY: ${{ secrets.SITE_ID }}
      run: |
        openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
          -pass env:TFPLAN_KEY -in tfplan -out tfplan.enc
        rm tfplan

    - name: Upload Terraform plan
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tfplan
        path: terraform/tfplan.enc
        retention-days: 1
        if-no-files-found: error


  approve:
    name: Manual Approval
    permissions: {}
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Manual approval checkpoint
      run: echo "Manual approval required to proceed with deployment"

  apply:
    name: Apply Terraform Changes
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [terraform, approve]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Terraform Init
      run: terraform init

    # Retrieve the plan produced (and approved) in the terraform job and apply
    # exactly that, so the applied changes match what was reviewed.
    - name: Download Terraform plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tfplan
        path: terraform

    - name: Decrypt Terraform plan
      env:
        TFPLAN_KEY: ${{ secrets.SITE_ID }}
      run: |
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
          -pass env:TFPLAN_KEY -in tfplan.enc -out tfplan
        rm tfplan.enc

    # Build the Lambda deployment packages on this runner. The Terraform config
    # also builds them via a null_resource provisioner, but that only re-runs
    # when its source hashes change; a function-code update applied from a saved
    # plan can otherwise reference a .zip that was never built on this fresh
    # runner. Building here guarantees the artifacts exist before apply.
    - name: Build Lambda packages
      working-directory: ${{ github.workspace }}
      run: |
        for fn in morning evening; do
          rm -rf "temp_$fn"
          mkdir -p "temp_$fn"
          cp "${fn}_config.py" netzero_client.py requirements.txt "temp_$fn/"
          python3 -m pip install --quiet -r requirements.txt -t "temp_$fn"
          (cd "temp_$fn" && zip -rq "$GITHUB_WORKSPACE/terraform/${fn}_config.zip" .)
          rm -rf "temp_$fn"
        done
        ls -l terraform/morning_config.zip terraform/evening_config.zip

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan

